<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeritasAI - Detector de Imágenes</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: var(--surface); padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 90%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        h1 { margin-bottom: 0.5rem; font-size: 1.8rem; }
        .status { font-size: 0.9rem; margin-bottom: 1.5rem; color: #94a3b8; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
        #preview { width: 100%; border-radius: 12px; margin-top: 1rem; display: none; border: 1px solid #334155; }
        .result-box { margin-top: 1.5rem; padding: 1rem; border-radius: 12px; background: #0f172a; display: none; border: 2px solid var(--primary); }
    </style>
</head>
<body>

    <div class="card">
        <h1>VeritasAI 🔍</h1>
        <div id="status" class="status">⏳ Cargando motor de IA...</div>

        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <button class="btn" onclick="document.getElementById('fileInput').click()">📁 Seleccionar Imagen</button>
        
        <img id="preview" alt="Imagen a analizar">
        
        <button class="btn" id="analyzeBtn" onclick="predict()" disabled>🚀 Analizar ahora</button>
        
        <div id="resultBox" class="result-box">
            <h2 id="label" style="margin:0; font-size: 1.4rem;">---</h2>
            <p id="confidence" style="margin:5px 0 0; color: #94a3b8;">---</p>
        </div>
    </div>

    <script>
        // TU MODELO (Asegúrate de que el enlace termina en barra "/")
        const URL_MODELO = "https://teachablemachine.withgoogle.com/models/VPWQNZdHz/";
        
        let model;

        async function init() {
            try {
                // Cargamos el modelo usando las librerías globales
                model = await tmImage.load(URL_MODELO + "model.json", URL_MODELO + "metadata.json");
                
                document.getElementById('status').innerText = "✅ IA Lista para usar";
                document.getElementById('status').style.color = "#10b981";
                document.getElementById('analyzeBtn').disabled = false;
            } catch (e) {
                console.error("Error crítico:", e);
                document.getElementById('status').innerText = "❌ Error de conexión con el modelo";
                document.getElementById('status').style.color = "#ef4444";
            }
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.getElementById('preview');
                img.src = event.target.result;
                img.style.display = "block";
                document.getElementById('resultBox').style.display = "none";
            }
            reader.readAsDataURL(file);
        });

        async function predict() {
            const img = document.getElementById('preview');
            const btn = document.getElementById('analyzeBtn');
            
            btn.innerText = "⌛ Analizando...";
            btn.disabled = true;

            try {
                const prediction = await model.predict(img);
                prediction.sort((a, b) => b.probability - a.probability);
                
                const resultBox = document.getElementById('resultBox');
                resultBox.style.display = "block";
                
                document.getElementById('label').innerText = prediction[0].className;
                document.getElementById('confidence').innerText = "Seguridad: " + (prediction[0].probability * 100).toFixed(1) + "%";
            } catch (err) {
                alert("Error al analizar la imagen");
            }

            btn.innerText = "🚀 Analizar ahora";
            btn.disabled = false;
        }

        // Arrancamos la carga
        init();
    </script>
</body>
</html>
