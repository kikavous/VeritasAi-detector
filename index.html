<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeritasAI - Detector</title>

    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob:; style-src * 'unsafe-inline';">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --text: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; border: 1px solid #334155; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn:disabled { background: #475569; }
        #preview { width: 100%; border-radius: 10px; margin-top: 15px; display: none; }
        .status { margin-bottom: 20px; font-weight: bold; }
        #result { margin-top: 20px; font-size: 1.2rem; display: none; padding: 10px; border-radius: 8px; background: #0f172a; border: 1px solid var(--primary); }
    </style>
</head>
<body>

    <h1>VeritasAI 🔍</h1>
    <div id="status" class="status">⏳ Cargando IA...</div>

    <div class="card">
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <button class="btn" onclick="document.getElementById('fileInput').click()">📁 Subir Imagen</button>
        
        <img id="preview">
        
        <button class="btn" id="runBtn" onclick="predict()" disabled>🚀 Analizar ahora</button>
        
        <div id="result">
            <div id="label" style="font-weight: bold; font-size: 1.5rem;"></div>
            <div id="conf"></div>
        </div>
    </div>

    <script>
        // TU ENLACE (Asegúrate de que termina en /)
        const URL_MODELO = "https://teachablemachine.withgoogle.com/models/VPWQNZdHz/";
        
        let model;

        async function cargarIA() {
            try {
                // Cargamos el modelo
                model = await tmImage.load(URL_MODELO + "model.json", URL_MODELO + "metadata.json");
                document.getElementById('status').innerText = "✅ IA LISTA";
                document.getElementById('status').style.color = "#10b981";
                document.getElementById('runBtn').disabled = false;
            } catch (e) {
                console.error(e);
                document.getElementById('status').innerText = "❌ ERROR: No se pudo cargar la IA";
            }
        }

        // Mostrar imagen al seleccionarla
        document.getElementById('fileInput').addEventListener('change', e => {
            const reader = new FileReader();
            reader.onload = () => {
                const img = document.getElementById('preview');
                img.src = reader.result;
                img.style.display = "block";
                document.getElementById('result').style.display = "none";
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        // Analizar la imagen
        async function predict() {
            const img = document.getElementById('preview');
            const prediction = await model.predict(img);
            
            // Ordenamos resultados
            prediction.sort((a, b) => b.probability - a.probability);
            
            document.getElementById('result').style.display = "block";
            document.getElementById('label').innerText = prediction[0].className;
            document.getElementById('conf').innerText = "Seguridad: " + (prediction[0].probability * 100).toFixed(1) + "%";
        }

        // Iniciar todo
        cargarIA();
    </script>
</body>
</html>
